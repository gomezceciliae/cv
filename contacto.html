<!doctype html>
<html lang="es">
   <head>
      <meta charset="utf-8">
      <meta name="description" content="Portfolio de Cecilia Gómez">
      <link rel="stylesheet" href="style.css" type="text/css">
      <link rel="stylesheet" href="https://use.typekit.net/nys6vjf.css" type="text/css">
      <link rel="icon" href="img/icon.png" type="image/png">
      <title>CGDG</title>
   </head>
   <body id="top">
      <header>
         <h1><a href="#top">CGDG</a></h1>
         <nav>
            <a href="index.html">cv</a> 
            <a href="portfolio/portfolio.html">portfolio</a>
         </nav>
      </header>
      <main>
         <section class="contacto">
            <h2>Contactá conmigo</h2>
            <form class="formulario">
               <div class="columna-izquierda">
                  <label for="nombre">Tu nombre</label>
                  <input
                     type="text"
                     id="nombre"
                     name="nombre"
                     placeholder="nombre">
                  <label for="email">E-mail</label>
                  <input
                     type="email"
                     id="email"
                     name="email"
                     placeholder="e-mail">
                  <label for="archivo">
                  Quiero adjuntar mi portfolio / cv
                  </label>
                  <div class="archivo-contenedor">
                     <label for="archivo" class="boton-archivo">
                     Seleccionar archivo
                     </label>
                     <span id="nombre-archivo">
                     Ningún archivo adjuntado
                     </span>
                     <input
                        type="file"
                        id="archivo"
                        name="archivo">
                  </div>
               </div>
               <div class="columna-derecha">
                  <label for="mensaje">Tu mensaje</label>
                  <textarea
                     id="mensaje"
                     name="mensaje"
                     placeholder="mensaje"></textarea>
                  <div class="acciones-formulario">
                     <div class="grupo-checks">
                        <label class="check">
                        <input type="checkbox" name="laboral">
                        <span></span>
                        Laboral
                        </label>
                        <label class="check">
                        <input type="checkbox" name="otros">
                        <span></span>
                        Otro/s
                        </label>
                     </div>
                     <button type="submit">
                     Enviar
                     </button>
                  </div>
               </div>
            </form>
         </section>
         <blockquote class="blockquote-contacto">
            <p>Soy una persona sincera, respetuosa. Soy irrespetuoso cuando las cosas no valen y debo serlo ★<cite>Astor Piazzolla</cite></p>
         </blockquote>
      </main>
      <footer>
         <div class="footer-izq">
            <div class="img-swap">
               <img src="img/copyright-1.png" class="img-uno" alt="Ceci posando" width="98" height="140">
               <img src="img/copyright-2.png" class="img-dos" alt="Ceci saludando" width="98" height="140">
            </div>
            <p>➋❤➋➏<span class="catedra">C ➂ Wis</span></p>
         </div>
         <ul>
            <li><a href="https://www.bifidaediciones.com.ar" target="_blank"><img src="img/bifida.png" alt="Logo Bífida Ediciones" width="40" height="40" class="logos"></a></li>
            <li><a href="https://www.linkedin.com/in/cgdg" target="_blank"><img src="img/linkedin.png" alt="Logo LinkedIn" width="40" height="40" class="logos"></a></li>
            <li><a href="https://www.behance.net/cgdg" target="_blank"><img src="img/behance.png" alt="Logo Behance" class="logos" width="40" height="40"></a></li>
         </ul>
      </footer>
   </body>
</html>
